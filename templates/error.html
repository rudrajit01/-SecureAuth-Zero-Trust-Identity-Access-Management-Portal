{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="card" style="text-align:center;padding:50px">
  <div style="font-size:52px">{{ '🚫' if code==403 else '⚠️' }}</div>
  <h1>Error {{ code }}</h1>
  <p class="muted">{{ msg }}</p>
  <a class="btn" href="{{ url_for('dashboard') }}">Go to Dashboard</a>
</div>
{% endblock %}
{% block auth %}
<div style="text-align:center">
  <div style="font-size:52px">⚠️</div>
  <h1>Error {{ code }}</h1>
  <p class="muted">{{ msg }}</p>
  <a class="btn" href="{{ url_for('login') }}">Back to Sign in</a>
</div>
{% endblock %}
